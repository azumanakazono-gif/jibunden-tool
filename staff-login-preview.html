<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>じぶん電気｜スタッフログイン（検証）</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f2f7f4;color:#163d31;padding:24px}
main{max-width:620px;margin:5vh auto;background:#fff;border:1px solid #cdded2;border-radius:16px;padding:28px;box-shadow:0 6px 20px #1233}
h1{font-size:1.5rem}p{line-height:1.75}#status{padding:16px;border-radius:8px;background:#eaf1ed;white-space:pre-wrap}
.note{font-size:.9rem;color:#555}#googleButton{margin:18px 0}a{color:#17634a}
</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><main>
<h1>☀️ じぶん電気｜スタッフログイン</h1>
<p>会社Googleアカウント・個人Gmailの両方を利用できます。初回は管理者の承認が必要です。承認は同じアカウントで継続して有効です。</p>
<div id="status" role="status">設定を確認しています…</div><div id="googleButton"></div>
<p class="note">検証用画面です。承認済みでも本番の顧客データやローン画面のアクセス権はまだ付与されません。</p>
<p><a href="staff-approval-preview.html">管理者用・承認待ちを確認する</a></p>
<script>
const statusEl=document.getElementById('status');
let timer=null;
const setStatus=(text)=>statusEl.textContent=text;
function renderStatus(data){
 if(data.status==='approved'){
   if(timer)clearInterval(timer);
   setStatus('✅ スタッフとして承認済みです。\nログイン承認は継続利用できます。\nローン画面の権限連携は現在検証中です。');
 }else if(data.status==='pending'){
   setStatus('⏳ 利用申請を受け付けました。\n中園管理者に承認依頼を送ります。承認されると画面が自動で更新されます。\n通知状態: '+(data.notification||'確認中'));
   if(!timer)timer=setInterval(checkStatus,5000);
 }else if(data.status==='suspended'||data.status==='rejected') {
   if(timer)clearInterval(timer);
   setStatus('現在このアカウントは利用できません。管理者へお問い合わせください。');
 }else setStatus('Googleでログインしてください。');
}
async function checkStatus(){
 try{
  const resp=await fetch('/api/staff-status-preview',{credentials:'same-origin',cache:'no-store'});
  if(resp.status===401){if(timer)clearInterval(timer);timer=null;return;}
  const data=await resp.json();
  if(data.ok)renderStatus(data);
 }catch{}
}
async function start(){
 try{
  const resp=await fetch('/api/staff-auth-preview',{cache:'no-store'});
  const cfg=await resp.json();
  if(!cfg.configured||!cfg.registrationEnabled){
    setStatus('現在、申請受付の準備中です。データへのアクセスは許可されていません。');
    return;
  }
  setStatus('Googleアカウントでログインしてください。');
  await checkStatus();
  const show=()=>{
   if(!window.google?.accounts?.id)return false;
   google.accounts.id.initialize({client_id:cfg.clientId,callback:async ({credential})=>{
    setStatus('Google本人確認と利用状態を確認しています…');
    try{
      const r=await fetch('/api/staff-auth-preview',{method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({credential})});
      const data=await r.json();
      if(!data.ok)throw Error(data.error||'LOGIN_FAILED');
      renderStatus(data);
    }catch(e){setStatus('申請に失敗しました: '+e.message+'。利用権限は付与されていません。');}
   }});
   google.accounts.id.renderButton(document.getElementById('googleButton'),{
    type:'standard',theme:'outline',size:'large',text:'signin_with'
   });
   return true;
  };
  if(!show())document.querySelector('script[src*="accounts.google.com/gsi/client"]')?.addEventListener('load',show,{once:true});
 }catch{setStatus('設定を取得できません。管理者にお問い合わせください。');}
}
start();
</script></main></body></html>
