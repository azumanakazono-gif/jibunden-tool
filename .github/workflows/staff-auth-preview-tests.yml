name: Staff auth preview policy tests

on:
  pull_request:
    paths:
      - 'api/staff-auth-preview.js'
      - 'customer-db-test/staff-*.mjs'
      - 'customer-db-test/google-identity-verifier.mjs'
      - '.github/workflows/staff-auth-preview-tests.yml'

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Node.js test runtime
        run: node --version
      - name: Test fail-closed staff approval and registry commands
        run: node --test customer-db-test/staff-approval-policy.test.mjs customer-db-test/staff-registry-commands.test.mjs
